<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Events — Bhumika Makwana</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    background: #ffffff;
    padding: 20px 24px;
    border-bottom: 1px solid #eaeaea;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .site-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }
  .site-title a {
    color: #111111;
    text-decoration: none;
  }
  nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin: 0;
    padding: 0;
  }
  nav a {
    color: #0645ad;
    text-decoration: none;
    font-size: 13px;
  }
  nav a:hover {
    text-decoration: underline;
  }
  @media (max-width: 480px) {
    header {
      flex-direction: column;
      align-items: flex-start;
    }
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }
  main > p.intro {
    max-width: 700px;
    font-size: 15px;
    line-height: 1.75;
    margin: 0 0 32px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }
  figure {
    margin: 0;
  }
  figure img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    background: #f2f2f2;
  }
  figcaption {
    margin-top: 8px;
    font-size: 13px;
    color: #444444;
    line-height: 1.5;
  }
  figcaption .event-date {
    color: #888888;
    font-size: 12px;
  }
</style>
</head>
